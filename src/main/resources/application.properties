# ═══════════════════════════════════════════════════════════════
# Jewelry Management System – Application Configuration
# ═══════════════════════════════════════════════════════════════

# ── Database (Embedded H2 – no MySQL installation required) ─────
# The DB file is created in the same folder where the app runs.
# On first launch the tables and seed data are auto-created.
db.url=jdbc:h2:file:./jewelry_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
db.username=sa
db.password=

# ── HikariCP Connection Pool ──────────────────────────────────────
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=30000

# ── Application ───────────────────────────────────────────────────
app.name=Jewelry Management System
app.version=1.0.0
